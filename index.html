<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">GiGi's first app using ClaudeCode</header>

  <main class="card">
    <h1>My To-Do List</h1>

    <form id="todo-form" novalidate>
      <input id="todo-input" type="text" placeholder="New task…" autocomplete="off" required>
      <input id="todo-date" type="date" title="Target date (optional)">
      <button type="submit">Add</button>
    </form>
    <div id="form-errors"></div>

    <ul id="todo-list"></ul>

    <footer>
      <span id="count">0 tasks left</span>
      <button id="clear-done" class="link">Clear completed</button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
